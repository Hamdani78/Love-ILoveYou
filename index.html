<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Heart Particle Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Persamaan Kurva Bentuk Hati
    function getHeartPos(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const NUM_ITEMS = 60;
    const SPEED = 0.005;
    let timeShift = 0;

    function draw() {
      // Latar Belakang Hitam Pekat
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, width, height);

      timeShift += SPEED;
      const scale = Math.min(width, height) / 45;

      for (let i = 0; i < NUM_ITEMS; i++) {
        const t = (i / NUM_ITEMS) * 2 * Math.PI + timeShift;
        const pos = getHeartPos(t);
        const posNext = getHeartPos(t + 0.01);

        const dx = posNext.x - pos.x;
        const dy = posNext.y - pos.y;
        const angle = Math.atan2(-dy, dx) - (30 * Math.PI / 180);

        const screenX = width / 2 + pos.x * scale;
        const screenY = height / 2 + pos.y * scale;

        ctx.save();
        ctx.translate(screenX, screenY);
        ctx.rotate(-angle);

        // Render Glow (Bayangan Putih Halus)
        ctx.font = "24px Arial, sans-serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
        ctx.fillText("I love you", 1, 1);

        // Render Teks Utama (Pink)
        ctx.fillStyle = "#ea80b0";
        ctx.fillText("I love you", 0, 0);

        ctx.restore();
      }

      requestAnimationFrame(draw);
    }

    // Langsung jalankan animasi begitu halaman dibuka
    draw();
  </script>
</body>
</html>
