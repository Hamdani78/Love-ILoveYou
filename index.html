<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Heart - I Love You</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background-color: #000000 !important;
            overflow: hidden;
            display: flex; justify-content: center; align-items: center;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, timeShift = 0;
        
        const SPEED = 0.005;
        const NUM_ITEMS = 65;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        window.addEventListener('resize', resize);
        resize();

        function getHeartPos(t) {
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x, y };
        }

        function animate() {
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, width, height);
            timeShift += SPEED;

            const scale = Math.min(width, height) / 45;
            const fontSize = Math.max(12, Math.floor(scale * 1.1));

            ctx.font = `bold ${fontSize}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            for (let i = 0; i < NUM_ITEMS; i++) {
                const t = (i / NUM_ITEMS) * 2 * Math.PI + timeShift;
                const pos = getHeartPos(t);
                const posNext = getHeartPos(t + 0.01);

                const dx = posNext.x - pos.x;
                const dy = posNext.y - pos.y;
                const angle = Math.atan2(dy, dx) - (30 * Math.PI / 180);

                const screenX = width / 2 + pos.x * scale;
                const screenY = height / 2 + pos.y * scale;

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.rotate(angle);

                ctx.shadowColor = '#ffffff';
                ctx.shadowBlur = 8;
                ctx.fillStyle = '#ea80b0';

                ctx.fillText('I love you', 0, 0);
                ctx.restore();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
