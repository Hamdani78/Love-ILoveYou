<html lang="en-us"><script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js" type=module id="site" data-python="python3.12" data-LINES=42 data-COLUMNS=132 data-os="vtx,snd,gui" async defer>#</script><head>

<script type="application/javascript">
config = {
    xtermjs : "1" ,
    _sdl2 : "canvas",
    user_canvas : 0,
    user_canvas_managed : 0,
    gui_divider : 2,
    ume_block : 1,
    can_close : 0,
    archive : "llo",
    gui_debug : 2,
    cdn : "https://pygame-web.github.io/cdn/0.9.3/",
    autorun : 0,
    PYBUILD : "3.12",
    fb_ar   :  1.77,
    fb_width : "1280",
    fb_height : "720"
}

function show_infobox() {
    infobox.style.display = "block";
    const w = infobox.offsetWidth;
    const h = infobox.offsetHeight;
    const left = (window.innerWidth - w) / 2;
    const top = (window.innerHeight - h) / 2;
    infobox.style.left = left + "px";
    infobox.style.top = top + "px";
}
</script>

    <title>Love Heart</title>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"/>

    <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">

    <style>
        #status {
            display: inline-block;
            vertical-align: top;
            margin-top: 20px;
            margin-left: 30px;
            font-weight: bold;
            color: rgb(120, 120, 120);
        }

        #progress {
            height: 20px;
            width: 300px;
        }

        #infobox {
            position: fixed;
            background: #ea80b0;
            color: #ffffff;
            font-weight: bold;
            padding: 14px 28px;
            border-radius: 8px;
            z-index: 999999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            cursor: pointer;
        }
        
        div.emscripten { text-align: center; }

        /* Mengatur Canvas Agar 100% Responsif & Penuh Layar Device */
        canvas.emscripten {
            border: 0px none;
            background-color: #000000;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 5;
            padding: 0;
            margin: 0;
            position: fixed;
            top: 0;
            left: 0;
            object-fit: contain;
        }

        html, body {
            font-family: arial;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000 !important;
            overflow: hidden;
        }
    </style>

    <script src="https://pygame-web.github.io/cdn/0.9.3//browserfs.min.js"></script>
</head>

<body>
    <div id="transfer" align=center style="display:none;">
        <div class="emscripten" id="status">Downloading...</div>
        <div class="emscripten">
            <progress value="0" max="100" id="progress"></progress>
        </div>
    </div>

    <canvas class="emscripten" id="canvas" width="100vw" height="100vh" oncontextmenu="event.preventDefault()" tabindex=1></canvas>
    <canvas class="emscripten" id="canvas3d" width="100vw" height="100vh" oncontextmenu="event.preventDefault()" tabindex=1 hidden></canvas>

    <div id="infobox">Loading, please wait ...</div>
    <div id="html"></div>

    <script type="application/javascript">
    async function custom_onload(debug_hidden) {
        show_infobox()
    }

    function custom_prerun(){}
    function custom_postrun(){}
    </script>
