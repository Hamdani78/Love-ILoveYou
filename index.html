<!DOCTYPE html>
<html lang="en-us">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <title>Love Heart</title>
    <link rel="icon" type="image/png" href="favicon.png" sizes="16x16">

    <style>
        html, body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000 !important;
            overflow: hidden;
        }

        canvas.emscripten {
            border: 0px none;
            background-color: #000000;
            width: 100vw !important;
            height: 100vh !important;
            z-index: 5;
            padding: 0;
            margin: 0;
            position: fixed;
            top: 0;
            left: 0;
        }

        #infobox {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #ea80b0;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            padding: 16px 32px;
            border-radius: 30px;
            z-index: 999999;
            box-shadow: 0 4px 20px rgba(234, 128, 176, 0.4);
            cursor: pointer;
            text-align: center;
        }

        #transfer { display: none; }
    </style>

    <script src="https://pygame-web.github.io/cdn/0.9.3/browserfs.min.js"></script>
</head>

<body>
    <div id="transfer" align="center">
        <div class="emscripten" id="status">Downloading...</div>
        <div class="emscripten">
            <progress value="0" max="100" id="progress"></progress>
        </div>
    </div>

    <canvas class="emscripten" id="canvas" width="100vw" height="100vh" oncontextmenu="event.preventDefault()" tabindex="1"></canvas>
    <canvas class="emscripten" id="canvas3d" width="100vw" height="100vh" oncontextmenu="event.preventDefault()" tabindex="1" hidden></canvas>

    <div id="infobox">Loading, please wait ...</div>

    <script type="module" id="site" data-python="python3.12" data-LINES="42" data-COLUMNS="132" data-os="vtx,snd,gui" src="https://pygame-web.github.io/cdn/0.9.3/pythons.js" async defer>#</script>

    <script type="application/javascript">
    config = {
        xtermjs : "1",
        _sdl2 : "canvas",
        user_canvas : 0,
        user_canvas_managed : 0,
        gui_divider : 2,
        ume_block : 1,
        can_close : 0,
        archive : "llo",
        gui_debug : 2,
        cdn : "https://pygame-web.github.io/cdn/0.9.3/",
        autorun : 0,
        PYBUILD : "3.12"
    };

    function show_infobox() {
        if (typeof infobox !== 'undefined') {
            infobox.style.display = "block";
        }
    }
    </script>
</body>
</html>
